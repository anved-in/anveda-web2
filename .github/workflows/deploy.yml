name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let an in-flight one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        env:
          # A GitHub Pages PROJECT site is served from /<repo>, so the app must
          # be built with that prefix. Moving to a custom domain later means
          # setting this to an empty string (see README).
          NEXT_PUBLIC_BASE_PATH: ${{ vars.NEXT_PUBLIC_BASE_PATH != '' && vars.NEXT_PUBLIC_BASE_PATH || format('/{0}', github.event.repository.name) }}
          # Razorpay's PUBLIC key id. Safe to expose (it identifies the account,
          # it does not authorise charges). Set it as a repository VARIABLE, not
          # a secret — secrets are unavailable to static client bundles anyway.
          NEXT_PUBLIC_RAZORPAY_KEY_ID: ${{ vars.NEXT_PUBLIC_RAZORPAY_KEY_ID }}
        run: npm run build

      - name: Add .nojekyll
        # Without this, GitHub Pages' Jekyll step strips directories beginning
        # with an underscore — which is where Next puts its assets (_next).
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
