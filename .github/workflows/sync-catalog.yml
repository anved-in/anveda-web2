name: Sync catalog from ANVEDA

# Pull products, photos, reels and help questions from the ANVEDA CMS, CHECK them, commit whatever changed, and let Cloudflare publish it.
#
# The CMS is the only place products are edited (admin.anveda.in). This brings the live shop in step. It runs:
#   - a minute or so after you save things in the CMS (the CMS starts it),
#   - every night, and
#   - by hand from the Actions tab: "Sync catalog from ANVEDA" -> Run workflow.
#
# Built to be boring and safe:
#   * the data is CHECKED before it is committed (scripts/validate-data.py): an empty or half-empty catalog from a CMS fault is refused,
#     so the live shop keeps its last good data instead of publishing a broken one;
#   * two runs colliding (several CMS saves in a row) recover by themselves (scripts/sync-publish.sh) instead of failing;
#   * the actions it uses are pinned to exact versions, and the job has a time limit.

on:
  workflow_dispatch:
    inputs:
      allow_shrink:
        description: "Allow the catalog to shrink a lot (tick only if you deliberately removed many designs or reels)"
        type: boolean
        default: false
  schedule:
    # 02:30 IST (21:00 UTC), after the day's catalogue edits, before morning.
    - cron: "0 21 * * *"

permissions:
  contents: write

concurrency:
  group: sync-catalog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ALLOW_SHRINK: ${{ inputs.allow_shrink && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      # Pillow turns a photo uploaded in the CMS (JPEG/PNG) into the site's WebP.
      - name: Install Pillow
        run: pip install --quiet pillow

      - name: Pull catalog, photos, reels and help questions
        run: python scripts/gen-catalog.py

      - name: Remove photos no longer in the catalog
        run: python scripts/prune-photos.py

      - name: Check the data before publishing it
        run: python scripts/validate-data.py

      - name: Commit and publish if anything changed
        id: commit
        run: |
          git config user.name  "anveda-catalog-sync"
          git config user.email "anveda.in@gmail.com"
          bash scripts/sync-publish.sh

      - name: Trigger Cloudflare Pages deploy
        # The commit above is pushed with the default GITHUB_TOKEN, which does not reliably fire Cloudflare Pages' "new push"
        # webhook, so a Deploy Hook tells Cloudflare "build whatever is on main right now". Only runs when something was pushed.
        if: steps.commit.outputs.changed == 'true'
        env:
          CF_DEPLOY_HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
        run: |
          # The secret has been saved with extra text around the URL before (Cloudflare shows a ready-made `curl ...` command and
          # pasting all of it breaks the value). So pull out just the exact shape of a Cloudflare deploy-hook URL, first one found.
          HOOK="$(printf '%s' "$CF_DEPLOY_HOOK" | grep -oE 'https://api\.cloudflare\.com/client/v4/pages/webhooks/deploy_hooks/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}' | head -n1 || true)"
          if [ -z "$CF_DEPLOY_HOOK" ]; then
            echo "::warning::CF_DEPLOY_HOOK secret not set, skipping deploy trigger."
            exit 0
          fi
          if [ -z "$HOOK" ]; then
            # Shape facts only, never the value itself (anyone holding the URL can trigger builds).
            LINES="$(printf '%s\n' "$CF_DEPLOY_HOOK" | wc -l)"
            echo "::error::CF_DEPLOY_HOOK holds no valid Cloudflare deploy-hook URL (secret is ${#CF_DEPLOY_HOOK} chars over $LINES line(s)). Re-save it as just the hook URL."
            exit 1
          fi
          # Several CMS saves in a row start several runs a few seconds apart. Cloudflare answers a repeat with HTTP 304 ("a build of
          # this branch is already queued"), which is fine. Anything else is retried, and only then reported.
          RESP="$(mktemp)"
          for attempt in 1 2 3; do
            CODE="$(curl -sS -o "$RESP" -w '%{http_code}' -X POST "$HOOK" || true)"
            if [ "$CODE" = "200" ]; then echo "Deploy hook triggered (HTTP 200)."; exit 0; fi
            if [ "$CODE" = "304" ]; then echo "::notice::Deploy hook answered HTTP 304: a build for this branch is already queued."; exit 0; fi
            echo "Deploy hook returned HTTP ${CODE:-none} (attempt $attempt of 3)."
            [ "$attempt" = "3" ] || sleep 15
          done
          echo "::error::Deploy hook returned HTTP ${CODE:-none} three times. Cloudflare said:"
          cat "$RESP"
          exit 1
