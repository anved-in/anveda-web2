name: Sync catalog from ANVEDA

# Pull products, photos and reels from the ANVEDA admin, commit whatever
# changed, and let the deploy workflow publish it.
#
# This is the storefront's CMS. Products are edited in ONE place — CMS 2.0 at
# anveda2.anveda-in.workers.dev/dash/catalog — and this brings the shop in
# step. There is deliberately no second product database to keep in sync.
#
# Run it from the Actions tab: "Sync catalog from ANVEDA" -> Run workflow.
# The schedule below also runs it every night, so the shop never drifts far.

on:
  workflow_dispatch:
  schedule:
    # 02:30 IST (21:00 UTC) — after the day's catalogue edits, before morning.
    - cron: "0 21 * * *"

permissions:
  contents: write

concurrency:
  group: sync-catalog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull catalog, photos and reels
        run: python scripts/gen-catalog.py

      - name: Remove photos no longer in the catalog
        run: python scripts/prune-photos.py

      - name: Commit if anything changed
        id: commit
        run: |
          git config user.name  "anveda-catalog-sync"
          git config user.email "anveda.in@gmail.com"
          git add -A src/data public/img/products public/img/reels
          if git diff --cached --quiet; then
            echo "Catalog unchanged — nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Summarise what moved, so the commit is readable in the history.
          SUMMARY=$(python scripts/catalog-summary.py || echo "catalog updated")
          git commit -m "Sync catalog from ANVEDA

          $SUMMARY

          Generated by .github/workflows/sync-catalog.yml"

          # main can move between this job's checkout and this push (e.g. a
          # manual push landing at the same time) — a plain `git push` then
          # gets rejected outright ("fetch first"), failing the whole run
          # over an ordinary race rather than a real problem. Retry a few
          # times, rebasing onto whatever is actually on main each time,
          # same as doing it by hand.
          for attempt in 1 2 3 4 5; do
            if git push; then
              break
            fi
            echo "push rejected (attempt $attempt) — fetching and rebasing onto the latest main"
            git fetch origin main
            git rebase origin/main
            if [ "$attempt" = "5" ]; then
              echo "::error::git push kept failing after 5 attempts — giving up this run."
              exit 1
            fi
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger Cloudflare Pages deploy
        # The commit above is pushed with the default GITHUB_TOKEN, which
        # does not reliably fire Cloudflare Pages' "new push" webhook (this
        # is why syncs were landing in git but never going live) — a Deploy
        # Hook sidesteps that entirely: it just tells Cloudflare "build
        # whatever's on `main` right now", regardless of who pushed it. Only
        # runs when the step above actually pushed something.
        if: steps.commit.outputs.changed == 'true'
        run: |
          if [ -z "${{ secrets.CF_DEPLOY_HOOK }}" ]; then
            echo "::warning::CF_DEPLOY_HOOK secret not set — skipping deploy trigger."
            exit 0
          fi
          curl -fsS -X POST "${{ secrets.CF_DEPLOY_HOOK }}"
