name: Sync catalog from ANVEDA

# Pull products, photos and reels from the ANVEDA admin, commit whatever
# changed, and let the deploy workflow publish it.
#
# This is the storefront's CMS. Products are edited in ONE place — CMS 2.0 at
# anveda2.anveda-in.workers.dev/dash/catalog — and this brings the shop in
# step. There is deliberately no second product database to keep in sync.
#
# Run it from the Actions tab: "Sync catalog from ANVEDA" -> Run workflow.
# The schedule below also runs it every night, so the shop never drifts far.

on:
  workflow_dispatch:
  schedule:
    # 02:30 IST (21:00 UTC) — after the day's catalogue edits, before morning.
    - cron: "0 21 * * *"

permissions:
  contents: write

concurrency:
  group: sync-catalog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull catalog, photos and reels
        run: python scripts/gen-catalog.py

      - name: Remove photos no longer in the catalog
        run: python scripts/prune-photos.py

      - name: Commit if anything changed
        id: commit
        run: |
          git config user.name  "anveda-catalog-sync"
          git config user.email "anveda.in@gmail.com"
          git add -A src/data public/img/products public/img/reels
          if git diff --cached --quiet; then
            echo "Catalog unchanged — nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Summarise what moved, so the commit is readable in the history.
          SUMMARY=$(python scripts/catalog-summary.py || echo "catalog updated")
          git commit -m "Sync catalog from ANVEDA

          $SUMMARY

          Generated by .github/workflows/sync-catalog.yml"

          # main can move between this job's checkout and this push (e.g. a
          # manual push landing at the same time) — a plain `git push` then
          # gets rejected outright ("fetch first"), failing the whole run
          # over an ordinary race rather than a real problem. Retry a few
          # times, rebasing onto whatever is actually on main each time,
          # same as doing it by hand.
          for attempt in 1 2 3 4 5; do
            if git push; then
              break
            fi
            echo "push rejected (attempt $attempt) — fetching and rebasing onto the latest main"
            git fetch origin main
            git rebase origin/main
            if [ "$attempt" = "5" ]; then
              echo "::error::git push kept failing after 5 attempts — giving up this run."
              exit 1
            fi
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger Cloudflare Pages deploy
        # The commit above is pushed with the default GITHUB_TOKEN, which
        # does not reliably fire Cloudflare Pages' "new push" webhook (this
        # is why syncs were landing in git but never going live) — a Deploy
        # Hook sidesteps that entirely: it just tells Cloudflare "build
        # whatever's on `main` right now", regardless of who pushed it. Only
        # runs when the step above actually pushed something.
        if: steps.commit.outputs.changed == 'true'
        env:
          CF_DEPLOY_HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
        run: |
          # curl's "(3) URL rejected: Malformed input to a URL function" has
          # hit this step repeatedly: the secret was saved with extra text
          # around the URL (Cloudflare's dashboard shows a ready-made
          # `curl -d "" "https://..."` command, and pasting that whole thing
          # — or a value with a newline in it — makes the value itself an
          # invalid URL). Stripping whitespace was not enough, so pull just
          # the https:// URL out of whatever was stored, whatever shape the
          # paste took.
          #
          # A looser "anything starting with https://" match then failed with
          # HTTP 400: the stored value held more than one line, and joining
          # them glued two URLs into one. So match the exact shape of a
          # Cloudflare deploy-hook URL (fixed host + path, UUID at the end)
          # and take the first one found, on the raw text.
          HOOK="$(printf '%s' "$CF_DEPLOY_HOOK" | grep -oE 'https://api\.cloudflare\.com/client/v4/pages/webhooks/deploy_hooks/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}' | head -n1 || true)"
          if [ -z "$CF_DEPLOY_HOOK" ]; then
            echo "::warning::CF_DEPLOY_HOOK secret not set — skipping deploy trigger."
            exit 0
          fi
          if [ -z "$HOOK" ]; then
            # Shape facts only — never the value itself (anyone holding the
            # URL can trigger builds).
            LINES="$(printf '%s\n' "$CF_DEPLOY_HOOK" | wc -l)"
            echo "::error::CF_DEPLOY_HOOK holds no valid Cloudflare deploy-hook URL (secret is ${#CF_DEPLOY_HOOK} chars over $LINES line(s)). Re-save it as just the hook URL."
            exit 1
          fi
          RESP="$(mktemp)"
          CODE="$(curl -sS -o "$RESP" -w '%{http_code}' -X POST "$HOOK" || true)"
          if [ "$CODE" != "200" ]; then
            echo "::error::Deploy hook returned HTTP ${CODE:-none}. Cloudflare said:"
            cat "$RESP"
            exit 1
          fi
          echo "Deploy hook triggered (HTTP 200)."
